name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Release tag (e.g. v0.1.0)"
        required: true
        default: "v0.1.0"

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build & Release (Windows)
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET 10.0
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.x"

      - name: Package Release Archives
        shell: pwsh
        run: |
          $ver = "0.1.0"
          ./build-package.ps1 -Version $ver -OutputDir "dist"

      - name: Publish GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = "${{ github.event.inputs.tag_name }}"
          if (-not $tag -or $tag -eq "") {
            $tag = $env:GITHUB_REF_NAME
          }
          if (-not $tag -or $tag -eq "") {
            $tag = "v0.1.0"
          }

          Write-Host "Creating/Updating GitHub Release for tag: $tag"
          $notes = @(
            "# PowerLessToy $tag",
            "",
            "## 🌟 包含组件 (Components)",
            "- **NotifyPosition 2.0**: Windows 原生通知深色卡片置换与「同意/驳回」一键代理。",
            "- **AccessHistory**: 零依赖高性能文件日志诊断器、Explorer COM 访问追踪与 Local / SMB / WSL 三栏面板。",
            "- **VirtualDesktopLoop**: 虚拟桌面无限循环切换（Win + Ctrl + 左右）。",
            "",
            "## 📦 架构支持 (Architectures)",
            "- Windows 10/11 x64 (Intel / AMD)",
            "- Windows 11 ARM64 (Snapdragon X / Apple Silicon 虚拟机)",
            "",
            "## 🚀 安装方法 (Quick Install)",
            "解压 `PowerLessToy-$tag-win-x64.zip`（或 `win-arm64`），右键管理员或普通 PowerShell 运行：",
            "```powershell",
            ".\install.ps1",
            "```"
          ) -join "`n"

          # Check if release exists
          $exists = $false
          try {
            $null = gh release view $tag
            $exists = $true
          } catch {
            $exists = $false
          }

          if ($exists) {
            Write-Host "Release $tag already exists, uploading assets..."
            gh release upload $tag (Get-ChildItem -Path "dist\*.zip").FullName --clobber
          } else {
            Write-Host "Creating release $tag..."
            gh release create $tag (Get-ChildItem -Path "dist\*.zip").FullName --title "PowerLessToy $tag" --notes $notes
          }
